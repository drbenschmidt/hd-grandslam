<h1>HDHR Streamer</h1>
<p>Use the API endpoints to list devices, lineup, EPG, and stream channels.</p>
<ul>
<li>Discover: <code>/api/discover/&lt;device-ip&gt;</code></li>
<li>Lineup: <code>/api/lineup/&lt;device-ip&gt;</code></li>
<li>EPG: <code>/api/epg/&lt;device-auth&gt;</code></li>
<li>Stream: <code>/stream/&lt;device-ip&gt;/&lt;guide-number&gt;</code></li>
</ul>
